name: CI - Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Database
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          npx prisma generate
          npx prisma db push
          node prisma/seed.js

      - name: Run Test Suite
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-test-secret-key-32-chars-long"
        run: node scripts/run-tests.js

      - name: Next.js Production Build
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-test-secret-key-32-chars-long"
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
